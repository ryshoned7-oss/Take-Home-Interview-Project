<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/26958f40da.js" crossorigin="anonymous"></script>
  <title>Movies & Stuff</title>
</head>
<body>
<section id="Navigation">
    <nav class="nav__container">
     <h1 class="logo">Movie Depot</h1>
      <ul class="navigation">
        <a href="#Movies" class="nav__links">Movies <span class="icon"><i class="fas fa-film"></i></span></a>
        <a href="#TV_Shows" class="nav__links">TV Shows <span class="icon"><i class="fas fa-tv"></i></span></a>
        <a href="#Live_Shows" class="nav__links">Live Shows <span class="icon"><i class="fas fa-wifi"></i></span></a>
        <a href="#Games" class="nav__links">Games <span class="icon"><i class="fas fa-gamepad"></i></span></a>
        <button class="btn__login">Login</button>
      </ul>
    </nav>
</section>

<main>
  <section id="Movies">
    <div class="wrapper">
    <div class="container">
      <div class="row">
    <h2 class="section__title">Movies</h2>
    <span class="icon-close"><i class="fas fa-close"></i></span>
    <header>
      <div class="header__title">
        <h3>Thrilling Films and Spectacular Cinema</h3>
      </div>
      </header>
        <div class="movies-controls">
          <div class="select-specific">
            <input id="select-input" type="text" placeholder="Search title or IMDB id (e.g. The Fast and the Furious)"/>
            <button id="select-btn">Go</button>
          </div>
          <div class="nav-controls">
            <button id="prev-btn" aria-label="Previous">Prev</button>
          <button id="next-btn" aria-label="Next">Next</button>
          </div>
        </div>
      <div id="movies-list" class="api-wrapper"></div>
      </div>
    </div>
    </div>
  </section>



  <!-- <section id="TV_Shows">
    <h3>TV</h3>
  </section>
  <section id="Live_Shows">
    <h3>Live</h3>
  </section>
  <section id="Games">
    <h3>Gaming</h3>
  </section> -->
</main>
<script src="app.js"></script>
</body>
</html>
